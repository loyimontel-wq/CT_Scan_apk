
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctscan"
version = "0.1.0"
description = "Industrial cone-beam CT simulation, reconstruction and analysis application"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "tifffile",
]

[project.optional-dependencies]
gui = [
    "PySide6",
    "napari",
]
acceleration = [
    "numba",
]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]